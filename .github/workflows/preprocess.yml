name: Preprocess Dataset

# Advance: preprocessing berjalan otomatis setiap ada perubahan pada data mentah
# atau script, dan hasil dataset terbaru di-commit kembali ke repo.
on:
  push:
    paths:
      - "telco_churn_raw.csv"
      - "automate_Epafraditus-Memoriano.py"
      - ".github/workflows/preprocess.yml"
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated preprocessing
        run: python "automate_Epafraditus-Memoriano.py" --input telco_churn_raw.csv --outdir telco_churn_preprocessing

      - name: Commit processed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telco_churn_preprocessing/
          git diff --staged --quiet || git commit -m "chore: update processed dataset [skip ci]"
          git push
